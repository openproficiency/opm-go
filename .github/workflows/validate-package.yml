name: Validate package

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "package.json"
      - "package-lock.json"
      - "scripts/vendor-schema.mjs"
      - "**/model/**"
      - "**/schema/**"
      - "**/schemas/**"
      - "VERSION"
      - ".github/workflows/validate-package.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Vendor schemas
        run: |
          npm ci
          npm run vendor:schema
          git diff --exit-code -- internal/schema/assets
          test -z "$(git status --porcelain -- internal/schema/assets)"

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Verify module files are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          test -z "$(git status --porcelain -- go.mod go.sum)"

      - name: Validate release version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$version" =~ $semver ]]; then
            echo "::error file=VERSION::VERSION must contain a valid semantic version without a leading v"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Build packages
        run: go build ./...

      - name: Run tests with race detector
        run: go test -race ./...
